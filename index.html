<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENZ AYURVEDA — WE DESERVE BETTER.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --ink:#141410;
  --olive:#4b5320;
  --olive-deep:#333a15;
  --olive-bright:#7c8c3e;
  --cream:#f3efe4;
  --cream-dim:#e6e0cf;
  --line:rgba(243,239,228,0.14);
  --danger:#a53f2b;
}

*{box-sizing:border-box;}
html,body{ margin:0; padding:0; background:var(--ink); color:var(--cream); font-family:'Space Grotesk', sans-serif; overscroll-behavior:none; }
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

.app{
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; position:relative; background:var(--ink); overflow:hidden;
}

.brush{ position:absolute; pointer-events:none; opacity:0.5; z-index:0; }
.brush.b1{ top:-40px; right:-60px; width:280px; transform:rotate(8deg); }
.brush.b2{ bottom:10%; left:-80px; width:240px; transform:rotate(-14deg); opacity:0.35;}
.brush.b3{ top:40%; right:-70px; width:200px; transform:rotate(20deg); opacity:0.25;}

.progress-wrap{ position:sticky; top:0; z-index:20; padding:14px 20px 10px; background:linear-gradient(180deg, var(--ink) 70%, transparent); }
.progress-meta{ display:flex; justify-content:space-between; align-items:baseline; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); margin-bottom:8px; font-weight:600; }
.progress-track{ height:4px; width:100%; background:rgba(243,239,228,0.12); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--olive-bright); border-radius:2px; transition:width 0.5s cubic-bezier(.65,0,.35,1); }

.screen{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 24px 40px; position:relative; z-index:1; animation:enter 0.4s cubic-bezier(.2,.8,.3,1); }
@keyframes enter{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
.screen.leaving{ animation:leave 0.2s ease forwards; }
@keyframes leave{ to{opacity:0; transform:translateY(-10px);} }

.cover{ justify-content:center; align-items:flex-start; text-align:left; min-height:100vh; min-height:100dvh; padding:40px 26px; }

.logo-mark{
  max-width:340px;
  width:78%;
  height:auto;
  display:block;
  margin:0 0 26px -4px;
}
.logo-mark.end-mark{
  max-width:300px;
  width:72%;
  margin:0 0 22px -4px;
}
.logo-watermark{
  position:absolute;
  top:14px;
  right:20px;
  width:74px;
  height:auto;
  opacity:0.5;
  z-index:5;
  pointer-events:none;
}

.survey-title{ font-family:'Archivo Black', sans-serif; font-size:clamp(20px, 5.8vw, 27px); line-height:1.16; color:var(--cream); letter-spacing:-0.01em; margin:0 0 16px; max-width:460px; }
.subtitle{ font-size:14.5px; line-height:1.55; color:var(--cream-dim); border-top:1px solid var(--line); padding-top:16px; max-width:440px; font-weight:500; }
.cover-block{ margin-top:26px; padding:16px 18px; border:1px solid var(--line); border-left:3px solid var(--olive-bright); background:rgba(243,239,228,0.03); }
.cover-block h3{ margin:0 0 8px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); }
.cover-block p{ margin:0 0 8px; font-size:13.5px; line-height:1.5; color:var(--cream-dim); }
.cover-block p:last-child{margin-bottom:0;}
.cover-block .emph{ color:var(--cream); font-weight:700; }

.privacy-note{ margin-top:12px; font-size:12.5px; line-height:1.5; color:var(--cream-dim); display:flex; gap:10px; align-items:flex-start; }
.privacy-note .dot{ width:6px;height:6px;border-radius:50%; background:var(--olive-bright); margin-top:6px;flex-shrink:0; }

.live-counter{
  margin-top:20px; display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--olive-bright);
  font-weight:600; padding:8px 14px; border:1px solid rgba(124,140,62,0.35); border-radius:20px; background:rgba(124,140,62,0.08);
}
.live-dot{ width:7px; height:7px; border-radius:50%; background:var(--olive-bright); animation:pulse 1.8s ease infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

.start-btn{
  margin-top:30px; width:100%; padding:18px; background:var(--olive-bright); color:var(--ink); border:none;
  font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; letter-spacing:0.04em; text-transform:uppercase;
  cursor:pointer; transition:transform 0.15s ease, background 0.15s ease;
}
.start-btn:active{ transform:scale(0.98); }
.start-btn:disabled{ opacity:0.45; cursor:not-allowed; transform:none; }
.start-btn:hover{ background:#8fa04a; }

.consent-box{ margin-top:24px; padding:18px; border:1px solid var(--line); border-left:3px solid var(--olive-bright); background:rgba(243,239,228,0.03); }
.consent-box h3{ margin:0 0 10px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); }
.consent-box p{ margin:0 0 10px; font-size:13px; line-height:1.5; color:var(--cream-dim); }
.consent-box p:last-of-type{ margin-bottom:0; }
.email-label{ display:block; margin-top:14px; font-size:12px; font-weight:700; color:var(--cream); }
.email-input{ width:100%; margin-top:7px; padding:13px 14px; background:rgba(243,239,228,0.05); border:1.5px solid var(--line); color:var(--cream); font-family:'Space Grotesk', sans-serif; font-size:15px; outline:none; }
.email-input:focus{ border-color:var(--olive-bright); }
.email-input::placeholder{ color:rgba(243,239,228,0.38); }
.consent-check{ display:flex; align-items:flex-start; gap:10px; margin-top:14px; font-size:12.5px; line-height:1.45; color:var(--cream-dim); }
.consent-question{ margin:16px 0 0; font-size:13px; font-weight:700; color:var(--cream); }
.consent-check input{ margin-top:3px; accent-color:var(--olive-bright); flex-shrink:0; }
.consent-actions{ display:flex; gap:10px; margin-top:18px; }
.consent-actions .start-btn{ margin-top:0; }
.decline-btn{ flex:0 0 42%; padding:16px 10px; background:transparent; color:var(--cream-dim); border:1.5px solid var(--line); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
.decline-btn:hover{ border-color:var(--cream-dim); color:var(--cream); }
.consent-error{ margin-top:9px; font-size:12px; line-height:1.4; color:#e6a08c; display:none; }

.section-screen{ justify-content:center; text-align:left; }
.section-eyebrow{ font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--olive-bright); font-weight:700; margin-bottom:14px; }
.section-title{ font-family:'Archivo Black', sans-serif; font-size:clamp(28px, 7.6vw, 38px); line-height:1.04; margin:0 0 16px; color:var(--cream); }
.section-desc{ font-size:14.5px; line-height:1.6; color:var(--cream-dim); max-width:420px; }
.section-motiv{ margin-top:22px; font-size:12.5px; color:var(--olive-bright); font-weight:600; border-top:1px solid var(--line); padding-top:14px; }

.q-eyebrow{ font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.q-eyebrow .num{ font-family:'Archivo Black', sans-serif; font-size:13px; color:var(--ink); background:var(--olive-bright); padding:2px 8px; }
.q-text{ font-family:'Archivo Black', sans-serif; font-size:clamp(22px, 6vw, 29px); line-height:1.14; color:var(--cream); margin:0 0 30px; letter-spacing:-0.01em; }

.options{ display:flex; flex-direction:column; gap:12px; }
.opt-btn{
  display:flex; align-items:center; justify-content:space-between; width:100%; padding:18px 20px;
  background:transparent; border:1.5px solid var(--line); color:var(--cream); font-family:'Space Grotesk', sans-serif;
  font-size:16px; font-weight:600; text-align:left; cursor:pointer; transition:border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.opt-btn:hover{ border-color:var(--olive-bright); background:rgba(124,140,62,0.08); }
.opt-btn:active{ transform:scale(0.99); }
.opt-btn.selected{ border-color:var(--olive-bright); background:rgba(124,140,62,0.16); }
.opt-btn .check{ width:20px;height:20px; border-radius:50%; border:1.5px solid var(--cream-dim); flex-shrink:0; position:relative; }
.opt-btn.selected .check{ border-color:var(--olive-bright); background:var(--olive-bright); }
.opt-btn.selected .check::after{ content:''; position:absolute; top:50%;left:50%; width:8px;height:8px; background:var(--ink); border-radius:50%; transform:translate(-50%,-50%); }

.mcq-col{ display:flex; flex-direction:column; gap:12px; }
.mcq-btn{
  padding:19px 18px; border:1.5px solid var(--line); background:transparent; color:var(--cream);
  font-family:'Archivo Black', sans-serif; font-size:15.5px; letter-spacing:0.01em; text-align:left; cursor:pointer; transition:all 0.15s ease;
}
.mcq-btn:hover{ border-color:var(--olive-bright); background:rgba(124,140,62,0.08); }
.mcq-btn:active{ transform:scale(0.99); }
.mcq-btn.tone-pos.selected{ background:var(--olive-bright); border-color:var(--olive-bright); color:var(--ink); }
.mcq-btn.tone-neg.selected{ background:var(--danger); border-color:var(--danger); color:var(--cream); }
.mcq-btn.tone-mid.selected{ background:rgba(243,239,228,0.92); border-color:var(--cream); color:var(--ink); }
.mcq-btn.tone-neutral.selected{ background:rgba(243,239,228,0.14); border-color:var(--cream-dim); color:var(--cream); }

textarea.text-input{
  width:100%; min-height:140px; padding:18px 16px; resize:vertical; background:rgba(243,239,228,0.04); border:1.5px solid var(--line);
  color:var(--cream); font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:500; line-height:1.5; outline:none; transition:border-color 0.15s ease;
}
textarea.text-input:focus{ border-color:var(--olive-bright); }
textarea.text-input::placeholder{ color:rgba(243,239,228,0.35); }
.helper{ font-size:13px; color:var(--cream-dim); margin-top:10px; }

.nav{ display:flex; gap:12px; padding:18px 24px 26px; position:relative; z-index:2; }
.nav-btn{ flex:1; padding:16px; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:0.03em; text-transform:uppercase; border:none; cursor:pointer; transition:all 0.15s ease; }
.nav-btn.back{ flex:0 0 90px; background:transparent; border:1.5px solid var(--line); color:var(--cream-dim); }
.nav-btn.back:hover{ border-color:var(--cream-dim); color:var(--cream); }
.nav-btn.next{ background:var(--olive-bright); color:var(--ink); }
.nav-btn.next:hover{ background:#8fa04a; }
.nav-btn.next:disabled{ background:rgba(243,239,228,0.1); color:rgba(243,239,228,0.3); cursor:not-allowed; }
.nav-btn:active:not(:disabled){ transform:scale(0.98); }
.skip-note{ text-align:center; font-size:12px; color:rgba(243,239,228,0.4); padding:0 24px 14px; }

.end-screen{ justify-content:center; align-items:flex-start; text-align:left; }
.end-screen .end-tag{ opacity:0; transform:translateY(14px) scale(.92); animation:thankYouReveal .9s cubic-bezier(.2,.85,.3,1) .05s forwards, thankYouGlow 2.2s ease-in-out 1s infinite; }
.end-screen .end-msg{ opacity:0; transform:translateY(10px); animation:endFadeUp .7s cubic-bezier(.2,.8,.3,1) .55s forwards; }
.end-screen .summary-box{ opacity:0; transform:translateY(10px); animation:endFadeUp .7s cubic-bezier(.2,.8,.3,1) .9s forwards; }
.end-screen .submit-status{ opacity:0; transform:translateY(10px); animation:endFadeUp .7s cubic-bezier(.2,.8,.3,1) 1.05s forwards; }
.end-screen .restart-link{ opacity:0; animation:endFadeIn .6s ease 1.25s forwards; }
@keyframes endFadeUp{ to{ opacity:1; transform:translateY(0); } }
@keyframes endFadeIn{ to{ opacity:1; } }
.end-tag{ font-weight:700; font-size:clamp(15px,4vw,17px); letter-spacing:0.08em; color:var(--olive-bright); text-transform:uppercase; margin:6px 0 18px; transform-origin:left center; }
.end-msg{ font-size:14.5px; line-height:1.6; color:var(--cream-dim); max-width:440px; }
.end-msg strong{ color:var(--cream); }

@keyframes thankYouReveal{ 0%{ opacity:0; transform:translateY(14px) scale(.92); letter-spacing:0.03em; } 65%{ opacity:1; transform:translateY(-2px) scale(1.04); letter-spacing:0.10em; } 100%{ opacity:1; transform:translateY(0) scale(1); letter-spacing:0.08em; } }
@keyframes thankYouGlow{ 0%,100%{ text-shadow:0 0 0 rgba(124,140,62,0); } 50%{ text-shadow:0 0 14px rgba(124,140,62,.28); } }

.pulse-box{ margin-top:24px; width:100%; border:1px solid var(--line); padding:16px 18px; background:rgba(243,239,228,0.03); }
.pulse-box h4{ margin:0 0 12px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); }
.pulse-bar{ display:flex; width:100%; height:10px; border-radius:6px; overflow:hidden; background:rgba(243,239,228,0.08); }
.pulse-seg{ height:100%; transition: width 0.8s cubic-bezier(.2,.8,.3,1); }
.pulse-seg.pos{ background:var(--olive-bright); }
.pulse-seg.mid{ background:var(--cream-dim); }
.pulse-seg.neg{ background:var(--danger); }
.pulse-legend{ display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; color:var(--cream-dim); }
.pulse-legend b{ color:var(--cream); }

.summary-box{ margin-top:20px; width:100%; border:1px solid var(--line); padding:16px 18px; background:rgba(243,239,228,0.03); }
.summary-box h4{ margin:0 0 10px; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--olive-bright); }
.summary-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--cream-dim); padding:6px 0; border-bottom:1px solid rgba(243,239,228,0.06); }
.summary-row:last-child{border-bottom:none;}
.summary-row b{ color:var(--cream); }

.dl-btn{ flex:1; padding:15px; border:1.5px solid var(--olive-bright); background:transparent; color:var(--olive-bright); font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer; transition:all 0.15s ease; }
.dl-btn:hover{ background:var(--olive-bright); color:var(--ink); }

.submit-status{ margin-top:20px; width:100%; padding:14px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px; border:1px solid var(--line); }
.submit-status.submitting{ color:var(--cream-dim); background:rgba(243,239,228,0.03); }
.submit-status.success{ color:var(--olive-bright); border-color:var(--olive-bright); background:rgba(124,140,62,0.1); }
.submit-status.error{ color:#e6a08c; border-color:var(--danger); background:rgba(165,63,43,0.1); line-height:1.5; }
.spinner{ width:14px;height:14px; border-radius:50%; border:2px solid rgba(243,239,228,0.25); border-top-color:var(--olive-bright); animation:spin 0.7s linear infinite; flex-shrink:0; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.restart-link{ margin-top:20px; font-size:13px; color:rgba(243,239,228,0.45); text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Space Grotesk', sans-serif; padding:0; }

::-webkit-scrollbar{ width:0px; }
:focus-visible{ outline: 2px solid var(--olive-bright); outline-offset: 2px; }
</style>
</head>

function logoPlate(kind){
  if(kind === 'cover'){
    return `<img class="logo-mark" src="${LOGO_SRC}" alt="GenZ Ayurveda — We Deserve Better.">`;
  }
  if(kind === 'end'){
    return `<img class="logo-mark end-mark" src="${LOGO_SRC}" alt="GenZ Ayurveda — We Deserve Better.">`;
  }
  return `<img class="logo-watermark" src="${LOGO_SRC}" alt="GenZ Ayurveda">`;
}

/* ---------------- State ---------------- */
let idx = 0;
const answers = {};
const answerTones = {}; // parallel record of answer tone metadata
const app = document.getElementById("app");
let flow;

function totalAnswerable(){ return flow.filter(f=>["select","mcq","longtext"].includes(f.type)).length; }

function answeredIndexPosition(){
  let n=0;
  for(let i=0;i<idx;i++){ if(["select","mcq","longtext"].includes(flow[i].type)) n++; }
  return n;
}
function isAnswered(step){
  if(!step) return true;
  if(step.type==="select") return !!answers[step.id];
  if(step.type==="mcq") return !!answers[step.id];
  if(step.type==="longtext") return true;
  return true;
}

        <h3>Informed Consent</h3>
        <p>This survey is for <strong style="color:var(--cream)">students and graduates of Government Ayurveda Medical Colleges in Karnataka</strong>. It aims to understand their experiences and identify areas for improvement in Ayurveda education.</p>
        <p>Participation is voluntary. <strong style="color:var(--cream)">Your email ID will be collected only to confirm that the response is from a genuine student or graduate and will be kept separate from your survey responses.</strong> It will not be used in the analysis or report.</p>
        <p>Your responses will be analysed in aggregate, and the findings will be compiled into a report and shared with <strong style="color:var(--cream)">relevant government authorities</strong> to support improvements in Ayurveda education in government institutions.</p>
        <p>You may choose not to participate or stop completing the survey at any time. <strong style="color:var(--cream)">Once submitted, your individual response may not be withdrawn.</strong></p>

        <label class="email-label" for="verificationEmail">Email ID <span style="color:var(--olive-bright)">(Required)</span></label>
        <input class="email-input" id="verificationEmail" type="email" autocomplete="email" placeholder="Enter your email ID" required aria-required="true">
        <div class="consent-check">
          <input id="consentAgree" type="checkbox">
          <label for="consentAgree">I have read and understood the above information and voluntarily consent to participate.</label>
        </div>
        <p class="consent-question">Do you agree to participate?</p>
        <div id="consentError" class="consent-error"></div>
        <div class="consent-actions">
          <button class="decline-btn" id="declineBtn" type="button">I Do Not Agree</button>
          <button class="start-btn" id="startBtn" type="button">I Agree &amp; Continue</button>
        </div>
      </div>
    </div>`;
  }
  else if(step.type==="section"){
    html = `
    <div class="progress-wrap">${progressBar()}</div>
    <div class="screen section-screen">
      ${brushWrap('b3',200)}
      ${logoPlate('watermark')}
      <div class="section-eyebrow">${step.eyebrow}</div>
      <h2 class="section-title">${step.title}</h2>
      <p class="section-desc">${step.desc}</p>
      ${step.motiv ? `<div class="section-motiv">${step.motiv}</div>` : ``}
    </div>
    ${navBar(true)}`;
  }

  else if(step.type==="select"){
    html = `
    <div class="progress-wrap">${progressBar()}</div>
    <div class="screen">
      ${logoPlate('watermark')}
      <div class="q-eyebrow"><span class="num">${step.num}</span><span>${step.section}</span></div>
      <h2 class="q-text">${step.q}</h2>
      <div class="options" id="optWrap">
        ${step.options.map(o=>{
          const val = typeof o==='object' ? o.val : o;
          const label = typeof o==='object' ? o.label : o;
          const sel = answers[step.id]===val ? 'selected' : '';
          return `<button class="opt-btn ${sel}" data-val="${escapeAttr(val)}"><span>${label}</span><span class="check"></span></button>`;
        }).join("")}
      </div>
    </div>
    ${navBar(false)}`;
  }

  else if(step.type==="mcq"){
    html = `
    <div class="progress-wrap">${progressBar()}</div>
    <div class="screen">
      ${logoPlate('watermark')}
      <div class="q-eyebrow">${step.standalone ? `<span>${step.section}</span>` : `<span class="num">Q${step.num}</span><span>${step.section} · ${step.num} OF ${step.total}</span>`}</div>
      <h2 class="q-text">${step.q}</h2>
      <div class="mcq-col">
        ${step.options.map(o=>{
          const sel = answers[step.id]===o.label ? 'selected' : '';
          return `<button class="mcq-btn tone-${o.tone} ${sel}" data-val="${escapeAttr(o.label)}" data-tone="${o.tone}">${o.label.toUpperCase()}</button>`;
        }).join("")}
      </div>
    </div>
    ${navBar(false)}`;
  }

  else if(step.type==="longtext"){
    html = `
    <div class="progress-wrap">${progressBar()}</div>
    <div class="screen">
      ${logoPlate('watermark')}
      <div class="q-eyebrow"><span>${step.section}</span></div>
      <h2 class="q-text">${step.q}</h2>
      <textarea class="text-input" id="textArea" placeholder="${escapeAttr(step.placeholder)}">${escapeAttr(answers[step.id]||'')}</textarea>
      <div class="helper">Optional — you can skip this and submit.</div>
    </div>
    ${navBar(false)}`;
  }

  else if(step.type==="end"){
    html = `
    <div class="screen end-screen">
      ${brushWrap('b2',220)}
      ${logoPlate('end')}
      <div class="end-tag">Thank you.</div>
      <div id="submitStateMsg" class="end-msg">Sending your response securely…</div>

      <div class="summary-box">
        <h4>Your response summary</h4>
        <div class="summary-row"><span>Respondent</span><b>${answers.respondent_type==='graduate' ? 'Graduate' : 'Student'}</b></div>
        <div class="summary-row"><span>College</span><b>${answers.college_name||'—'}</b></div>
        <div class="summary-row"><span>Questions answered</span><b>${countAnswered()}/${mcqTotal()}</b></div>
      </div>

      <div id="submitStatus" class="submit-status submitting">
        <span class="spinner"></span> Saving your response…
      </div>

      <button class="restart-link" id="restartBtn">Submit another response</button>
    </div>`;
  }

  app.innerHTML = html;
  attachHandlers(step);
  if(step.type==="cover") loadLiveCounter();
  if(step.type==="end") saveResponse();
  window.scrollTo(0,0);
}

/* ---------------- storage / counter ---------------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzGa0CBK2OwMjig7vL28SJdnrZSycKAPtPB7IdvyfuZbwI-E-Gn4lmRIrLVkBI8p2Zf/exec";

async function loadLiveCounter(){
  const el = document.getElementById("liveCounter");
  const txt = document.getElementById("liveCounterText");
  if(!el || !txt || SCRIPT_URL.indexOf("PASTE_")===0) return;
  try{
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    const count = data && data.count ? data.count : 0;
    if(count > 0){
      txt.textContent = count + (count===1 ? " student has" : " students have") + " already spoken up";
      el.style.display = "inline-flex";
    }
  }catch(e){}
}

async function saveResponse(){
  const statusEl = document.getElementById("submitStatus");
  const msgEl = document.getElementById("submitStateMsg");
  if(!statusEl || submitted) return;
  try{
    if(SCRIPT_URL.indexOf("PASTE_")===0) throw new Error("endpoint not configured");
    // send only answers that belong to the chosen respondent path
    const clean = {};
    flow.forEach(f=>{ if(f.id && answers[f.id] !== undefined) clean[f.id] = answers[f.id]; });
    const payload = {
      timestamp: new Date().toISOString(),
      email: window.__verificationEmail || "",
      answers: clean
    };
    // text/plain avoids a CORS preflight, which Apps Script cannot answer
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if(out.duplicate){
      submitted = true;
      statusEl.className = "submit-status error";
      statusEl.innerHTML = "This email ID has already submitted a response. Only one response per person is accepted.";
      if(msgEl) msgEl.innerHTML = `Thank you for your interest.`;
      return;
    }
    if(!out.ok) throw new Error(out.error || "save failed");
    submitted = true;
    statusEl.className = "submit-status success";
    statusEl.innerHTML = "Response saved successfully.";
    if(msgEl) msgEl.innerHTML = `Thank you for taking the time to share your experience. <strong>Your response has been recorded.</strong> Your contribution will help identify areas for improvement in Ayurveda education.`;
  }catch(e){
    statusEl.className = "submit-status error";
    statusEl.innerHTML = `We couldn't save your response. Please check your internet connection. <button type="button" id="retryBtn" style="margin-left:8px;padding:6px 12px;background:var(--cream);color:var(--ink);border:0;font-weight:700;cursor:pointer">Try again</button>`;
    if(msgEl) msgEl.innerHTML = `Your response has not been saved yet.`;
    const rb = document.getElementById("retryBtn");
    if(rb) rb.addEventListener("click", ()=>{
      statusEl.className = "submit-status submitting";
      statusEl.innerHTML = '<span class="spinner"></span> Saving your response…';
      saveResponse();
    });
  }
}

function progressBar(){
  const answered = answeredIndexPosition();
  const pct = Math.round((answered/totalAnswerable())*100);
  const step = flow[idx];
  const currentSection = step.section || (step.type==='section' ? step.eyebrow.replace('SECTION ','S') : '');
  return `
    <div class="progress-meta"><span>${currentSection || 'GENZ AYURVEDA'}</span><span>${pct}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;
}

function navBar(isSection){
  const step = flow[idx];
  const canBack = idx>0;
  const disabled = !isAnswered(step) && !step.optional ? 'disabled' : '';
  const label = idx===flow.length-2 ? 'Submit' : (isSection ? 'Start section' : 'Continue');
  return `
    <div class="nav">
      ${canBack ? `<button class="nav-btn back" id="backBtn">Back</button>` : ``}
      <button class="nav-btn next" id="nextBtn" ${disabled}>${label}</button>
    </div>
    ${step.type==='longtext' ? `<div class="skip-note">This question is optional</div>` : ``}
  `;
}

function countAnswered(){
  const ids = flow.filter(f=>f.type==="mcq").map(f=>f.id);
  return ids.filter(id=>answers[id]!==undefined).length;
}
function mcqTotal(){ return flow.filter(f=>f.type==="mcq").length; }
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()); }
let navigating = false;
let submitted = false;
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function goNext(){
  if(navigating) return;
  navigating = true;
  const screenEl = document.querySelector('.screen');
  if(screenEl) screenEl.classList.add('leaving');
  setTimeout(()=>{ navigating = false; if(idx < flow.length-1){ idx++; render(); } }, 160);
}
function goBack(){ if(idx>0){ idx--; render(); } }

function attachHandlers(step){
  const startBtn = document.getElementById("startBtn");
  if(startBtn) {
    const emailEl = document.getElementById("verificationEmail");
    const agreeEl = document.getElementById("consentAgree");
    const errorEl = document.getElementById("consentError");
    const updateConsentButton = ()=>{
      const emailValid = !!emailEl && isValidEmail(emailEl.value);
      const agreed = !!agreeEl && agreeEl.checked;
      startBtn.disabled = !(emailValid && agreed);
      if(errorEl && emailValid && agreed) errorEl.style.display='none';
    };
    if(emailEl) emailEl.addEventListener('input', updateConsentButton);
    if(agreeEl) agreeEl.addEventListener('change', updateConsentButton);
    updateConsentButton();
    startBtn.addEventListener("click", ()=>{
      const email = emailEl ? emailEl.value.trim() : "";
      if(!emailEl || !isValidEmail(emailEl.value)){
        if(errorEl){ errorEl.textContent = "Please enter a valid email ID for verification."; errorEl.style.display='block'; }
        return;
      }
      if(!agreeEl || !agreeEl.checked){
        if(errorEl){ errorEl.textContent = "Please confirm your consent to continue."; errorEl.style.display='block'; }
        return;
      }
      window.__verificationEmail = email;
      if(errorEl) errorEl.style.display='none';
      haptic(10); goNext();
    });
  }

  const declineBtn = document.getElementById("declineBtn");
  if(declineBtn) declineBtn.addEventListener("click", ()=>{
    haptic(6);
    const app = document.getElementById("app");
    if(app) app.innerHTML = `<div class="screen end-screen"><div class="end-tag">Thank you.</div><div class="end-msg">You have chosen not to participate in this survey. No survey response has been submitted.</div></div>`;
  });

  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ haptic(6); goBack(); });

  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    if(step.type==="longtext"){ answers[step.id]=document.getElementById("textArea").value; }
    haptic(10); goNext();
  });

  // selecting an option marks it visually and enables Next, but does NOT auto-advance —
  // the student explicitly taps Next/Continue to move on
  if(step.type==="select"){
    document.querySelectorAll("#optWrap .opt-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        haptic(8);
        const val = btn.getAttribute("data-val");
        answers[step.id]=val;
        if(step.id==="respondent_type"){
          const otherKeys = val==='graduate' ? STUDENT_ID_KEYS : GRAD_ID_KEYS;
          otherKeys.forEach(k=>{ delete answers[k]; delete answerTones[k]; });
        }
        document.querySelectorAll("#optWrap .opt-btn").forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        const nb = document.getElementById("nextBtn");
        if(nb) nb.removeAttribute('disabled');
      });
    });
  }

  if(step.type==="mcq"){
    document.querySelectorAll(".mcq-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        haptic(8);
        answers[step.id]=btn.getAttribute("data-val");
        answerTones[step.id]=btn.getAttribute("data-tone");
        document.querySelectorAll(".mcq-btn").forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        const nb = document.getElementById("nextBtn");
        if(nb) nb.removeAttribute('disabled');
      });
    });
  }

  const restartBtn = document.getElementById("restartBtn");
  if(restartBtn) restartBtn.addEventListener("click", ()=>{
    Object.keys(answers).forEach(k=>delete answers[k]);
    Object.keys(answerTones).forEach(k=>delete answerTones[k]);
    submitted = false;
    navigating = false;
    idx=0;
    render();
  });

  // swipe-back gesture
  let touchStartX = null;
  const screenEl = document.querySelector('.screen');
  if(screenEl){
    screenEl.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
    screenEl.addEventListener('touchend', e=>{
      if(touchStartX===null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if(dx > 80 && idx>0 && step.type!=="end" && !submitted) goBack();
      touchStartX = null;
    }, {passive:true});
  }
}

render();
})();
</script>
